---
# The global properties are used to configure multiple charts at once.
global:
  # -- The Top-Level-Domain (TLD) name which is used in f.e. in Ingress component.
  domain: "example.org"

  # Define the Subdomain for components used in f.e. in Ingress component.
  hosts:
    # -- Subdomain for Keycloak, results in "https://{{ keycloak }}.{{ domain }}".
    keycloak: "id"
    # -- Subdomain for openDesk portal, results in "https://{{ portal }}.{{ domain }}".
    portal: "portal"
    # -- Subdomain for Intercom Service, results in "https://{{ intercomservice }}.{{ domain }}".
    intercomService: "ics"

  # -- Container registry address.
  registry: "registry.opencode.de"

  # -- Credentials to fetch images from private registry
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  #
  # imagePullSecrets:
  #   - "docker-registry"
  #
  imagePullSecrets: []

# -- Affinity for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
# Note: podAffinityPreset, podAntiAffinityPreset, and  nodeAffinityPreset will be ignored when it's set
affinity: {}

# -- Additional custom annotations to add to all deployed objects.
additionalAnnotations: {}

# -- Additional custom labels to add to all deployed objects.
additionalLabels: {}

# Helm release cleanup setting.
cleanup:
  # -- Keep Pods/Job logs after successful run.
  deletePodsOnSuccess: false
  # -- Keep Pods/Job logs for following time.
  deletePodsOnSuccessTimeout: 1800
  # -- Keep persistence on delete of this release.
  keepPVCOnDelete: false

# Whether to allocate persistent volume disk for the data directory.
# In case of node failure, the node data directory will still persist.
#
# Keycloak configuration.
config:
  # -- Most applications do not implement OIDC based authorization yet. To block access
  # to an application it is possible to provide the OIDC claims (defined within a given OIDC
  # scope) required by the application based only when the user is member of a defined group.
  # This can be configured here.
  # The `applicationIdentifier` can be freely chosen, you then need to define the names of
  # the OIDC `client` and `scope`, the `group` defines which membership a user must have to
  # allow the `scope` to be part of the OIDC token. And the `role` is the Keycloak internal
  # role name required the is required to setup the mapping between group membership and
  # scope permission.
  # ```
  # applicationIdentifier:
  #   client: "opendesk-matrix"
  #   scope: "opendesk-matrix-scope"
  #   group: "managed-by-attribute-Livecollaboration"
  #   role: "opendesk-matrix-access-control"
  clientAccessRestrictions: {}
  # In this section you can define various objects based on Keycloaks config format
  # The object classes are processed by the Python script `kcom.py` that is shipped
  # with the Helm charts image. If you add new classes here you want to ensure they
  # are supported by the script.
  custom:
    # -- Create client scopes based on a YAML version of Keycloak's JSON config format
    clientScopes: {}
    # -- Create clients based on a YAML version of Keycloak's JSON config format
    clients:
      # -- Plain value of the Client Objects (fallback if no secret exists inside of Kubernetes).
      value: {}
      # -- Client Objects confidential data from existing secret (higher precedence than plain value)
      existingSecret:
        # -- Name of the Kubernetes secret that contains confidential data for the Client Objects
        name: ""
        # -- Key inside the Kubernetes secret that contains the confidential data for the Client Objects
        key: ""

  # Debugging related settings
  debug:
    # -- Enable debug output of included Ansible scripts
    enabled: false
    # -- Seconds for the job to pause before starting the actual bootstrapping.
    pauseBeforeScriptStart: 0

  # Keycloak specific attributes.
  keycloak:
    # Allow cluster internal communication for configuring Keycloak.
    # Required in case the /admin console of Keycloak is not exposed to the public internet
    intraCluster:
      # -- Enable internal communication
      enabled: true
      # -- Internal hostname including protocol and port
      # Currently only http and https with valid certificates are supported.
      internalBaseUrl: "http://ums-keycloak:8080"
    admin:
      # Plain values for admin username and admin password
      values:
        # -- The Keycloak master realm admin user
        username: "kcadmin"
        # -- The Keycloak master realm admin user's password as input for the secret
        password: ""
      # Admin user credentials from existing secret (higher precedence over plain values)
      secret:
        # -- Secret name containing admin credentials.
        # -- Format has to be:
        # -- admin.yaml: |
        # --   username:
        # --   password:
        name: ""
    # -- The name of the realm that is going to contain all the configuration
    realm: "opendesk"

  # As `kcom.py` does reconciliation we delete unexpected objects from Keycloak's configuration.
  # Define the names of the objects you do not define in the `custom` and `opendesk` areas above,
  # that you still would like to keep, e.g. because they are Keycloak defaults or manually maintained.
  managed:
    # -- Managed client scopes that should be kept during reconciliation.
    clientScopes: [ 'acr', 'web-origins', 'email', 'profile', 'microprofile-jwt', 'role_list', 'offline_access', 'roles', 'address', 'phone' ]
    # -- Managed clients that should be kept during reconciliation.
    clients: [ 'UMC', 'guardian-management-api', 'guardian-scripts', 'guardian-ui', '${client_account}', '${client_account-console}', '${client_admin-cli}', '${client_broker}', '${client_realm-management}', '${client_security-admin-console}' ]

  # In this section you can define various objects based on Keycloak's config format
  # The object classes are processed by the Python script `kcom.py` that is shipped
  # with the Helm charts image. If you add new classes here you want to ensure they
  # are supported by the script.
  opendesk:
    # -- Create client scopes based on a YAML version of Keycloak's JSON config format
    clientScopes: {}
    # -- Create clients based on a YAML version of Keycloak's JSON config format
    clients:
      # -- Plain value of the Client Objects (fallback if no secret exists inside of Kubernetes).
      value: {}
      # -- Client Objects confidential data from existing secret (higher precedence than plain value)
      existingSecret:
        # -- Name of the Kubernetes secret that contains confidential data for the Client Objects
        name: ""
        # -- Key inside the Kubernetes secret that contains the confidential data for the Client Objects
        key: ""

  # -- Groups that will be pre-created in Keycloak to avoid race conditions when first users login
  # to an openDesk deployment in parallel and Keycloak tries to create the groups in parallel as
  # well resulting in a `org.keycloak.models.ModelDuplicateException: Duplicate resource error`
  precreateGroups: [ 'Domain Admins', 'Domain Users' ]

  # Configure base parameters of the openDesk realm
  realmSettings:
    # -- Ref.: "Access Token Lifespan" in https://www.keycloak.org/docs/latest/server_admin/
    accessTokenLifespan: 300
    # -- Ref.: "Access Token Lifespan For Implicit Flow" in https://www.keycloak.org/docs/latest/server_admin/
    accessTokenLifespanForImplicitFlow: 900
    # -- Ref.: "SSO Session Idle" in https://www.keycloak.org/docs/latest/server_admin/
    ssoSessionIdleTimeout: 14400
    # -- Ref.: "SSO Session Max" in https://www.keycloak.org/docs/latest/server_admin/
    ssoSessionMaxLifespan: 57600
    # -- Enable "Remember Me" option making the user's Keycloak session persistant based on the RememberMe
    # related parameters below
    rememberMe: true
    # -- Ref.: "SSO Session Idle Remember Me" in https://www.keycloak.org/docs/latest/server_admin/
    ssoSessionIdleTimeoutRememberMe: 28800
    # -- Ref.: "SSO Session Max Remember Me" in https://www.keycloak.org/docs/latest/server_admin/
    ssoSessionMaxLifespanRememberMe: 1209600
    # -- Ref.: "Revoke Refresh Token" in https://www.keycloak.org/docs/latest/server_admin/
    revokeRefreshToken: false
    # -- Ref.: "Offline Session Idle" in https://www.keycloak.org/docs/latest/server_admin/
    offlineSessionIdleTimeout: 2592000
    # -- Ref.: "Offline Session Max Limited" in https://www.keycloak.org/docs/latest/server_admin/
    offlineSessionMaxLifespanEnabled: false
    # -- Ref.: "Offline Session Max" in https://www.keycloak.org/docs/latest/server_admin/
    offlineSessionMaxLifespan: 5184000
    # -- Ref.: "Client Session Idle" in https://www.keycloak.org/docs/latest/server_admin/
    clientSessionIdleTimeout: 0
    # -- Ref.: "Client Session Max" in https://www.keycloak.org/docs/latest/server_admin/
    clientSessionMaxLifespan: 0
    # -- Ref.: "Client Offline Session Idle" in https://www.keycloak.org/docs/latest/server_admin/
    clientOfflineSessionIdleTimeout: 0
    # -- Ref.: "Client Offline Session Max" in https://www.keycloak.org/docs/latest/server_admin/
    clientOfflineSessionMaxLifespan: 0
    # -- Setting the realm wide value using Keycloak's REST API
    accessCodeLifespan: 60
    # -- Setting the realm wide value using Keycloak's REST API
    accessCodeLifespanUserAction: 300
    # -- Setting the realm wide value using Keycloak's REST API
    accessCodeLifespanLogin: 1800
    # -- Setting the realm wide value using Keycloak's REST API
    actionTokenGeneratedByAdminLifespan: 43200
    # -- Setting the realm wide value using Keycloak's REST API
    actionTokenGeneratedByUserLifespan: 300
    # -- Setting the realm wide value using Keycloak's REST API
    oauth2DeviceCodeLifespan: 600
    # -- Setting the realm wide value using Keycloak's REST API
    oauth2DevicePollingInterval: 5
    # -- Setting the realm wide value using Keycloak's REST API
    refreshTokenMaxReuse: 0

  # Optional SSO Federation
  ssoFederation:
    # -- Enable SSO federation
    enabled: false
    # -- Enforce login for the IdP configured with this very key in 'value' using the SSO federation disables the local Keycloak login (for the realm)
    enforceFederatedLogin: ""
    value: {}
      # -- IdP Configuration confidential data from existing secret (higher precedence than plain value)
    existingSecret:
      # -- Name of the Kubernetes secret that contains confidential data for the IdP Configuration
      name: ""
      # -- Key inside the Kubernetes secret that contains the confidential data for the IdP Configuration
      key: ""

  # Extended 2FA configuration
  twoFactorSettings:
    # -- Enable 2FA for given LDAP group(s), just use group Names like `Domain Admin` etc.
    # this requires the name of Keycloak's 2FA roles to be provided as well, see `roleName`.
    # Note: This does not remove 2FA for groups.
    additionalGroups: []
    # -- You must provide Keycloak's 2FA role name when enabling 2FA for groups using the `2faGroups` Array.
    roleName: "2FA role"

# Security Context.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
containerSecurityContext:
  # -- Enable container privileged escalation.
  allowPrivilegeEscalation: false

  # -- Security capabilities for container.
  capabilities:
    drop:
      - "ALL"

  # -- Enable security context.
  enabled: true

  # -- Process user id.
  runAsUser: 1000

  # -- Process group id.
  runAsGroup: 1000

  # Set Seccomp profile.
  seccompProfile:
    # -- Disallow custom Seccomp profile by setting it to RuntimeDefault.
    type: "RuntimeDefault"

  # -- Mounts the container's root filesystem as read-only.
  readOnlyRootFilesystem: true

  # -- Run container as a user.
  runAsNonRoot: true

# -- Array with extra environment variables to add to containers.
#
# extraEnvVars:
#   - name: FOO
#     value: "bar"
#
extraEnvVars: []

# -- Optionally specify an extra list of additional volumes.
extraVolumes: []

# -- Optionally specify an extra list of additional volumeMounts.
extraVolumeMounts: []

# -- Credentials to fetch images from private registry
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
#
# imagePullSecrets:
#   - "docker-registry"
#
imagePullSecrets: []

# Container image section.
image:
  # -- Container registry address. This setting has higher precedence than global.registry.
  registry: "registry.opencode.de"

  # -- Container repository string.
  repository: "bmi/opendesk/components/platform-development/images/opendesk-keycloak-bootstrap"

  # -- Define an ImagePullPolicy.
  #
  # Ref.: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
  #
  # "IfNotPresent" => The image is pulled only if it is not already present locally.
  # "Always" => Every time the kubelet launches a container, the kubelet queries the container image registry to
  #             resolve the name to an image digest. If the kubelet has a container image with that exact digest cached
  #             locally, the kubelet uses its cached image; otherwise, the kubelet pulls the image with the resolved
  #             digest, and uses that image to launch the container.
  # "Never" => The kubelet does not try fetching the image. If the image is somehow already present locally, the
  #            kubelet attempts to start the container; otherwise, startup fails
  #
  imagePullPolicy: "IfNotPresent"

  # -- Define image tag.
  tag: "latest"

# -- Node labels for pod assignment
# Ref: https://kubernetes.io/docs/user-guide/node-selection/
nodeSelector: {}

# -- Pod Annotations.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# -- Pod Labels.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Pod Security Context.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  # -- Enable security context.
  enabled: true

  # -- If specified, all processes of the container are also part of the supplementary group.
  fsGroup: 1000

  # -- Change ownership and permission of the volume before being exposed inside a Pod.
  fsGroupChangePolicy: "Always"

# Configure resource requests and limits.
#
# http://kubernetes.io/docs/user-guide/compute-resources/
#
resources:
  limits:
    # -- The max amount of RAM to consume.
    memory: "1Gi"
  requests:
    # -- The amount of CPUs which has to be available on the scheduled node.
    cpu: "100m"
    # -- The amount of RAM which has to be available on the scheduled node.
    memory: "256Mi"

# Service account to use.
# Ref.: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # -- Additional custom annotations for the ServiceAccount.
  annotations: {}

  # -- Allows auto mount of ServiceAccountToken on the serviceAccount created. Can be set to false if pods using this
  # serviceAccount do not need to use K8s API.
  automountServiceAccountToken: false

  # -- Enable creation of ServiceAccount for pod.
  create: true

  # -- Additional custom labels for the ServiceAccount.
  labels: {}

# -- In seconds, time the given to the pod needs to terminate gracefully.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
terminationGracePeriodSeconds: ""

# -- Tolerations for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Topology spread constraints rely on node labels to identify the topology domain(s) that each Node is in
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
#
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: failure-domain.beta.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
topologySpreadConstraints: []

...
