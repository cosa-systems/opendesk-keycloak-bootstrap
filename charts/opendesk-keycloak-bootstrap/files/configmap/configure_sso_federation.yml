---
- name: "Check if the enforced federated login is defined with that very name."
  when: >-
    global_cfgobj.config.ssoFederation.enabled
    and global_cfgobj.config.ssoFederation.enforceFederatedLogin is defined
  ansible.builtin.assert:
    that:
      - global_cfgobj.config.ssoFederation.enforceFederatedLogin in global_cfgobj.config.ssoFederation.idps | list
    fail_msg: "Enforced federated login '{{ global_cfgobj.config.ssoFederation.enforceFederatedLogin }}' is not defined as IdP!"
    success_msg: "Enforced federated login '{{ global_cfgobj.config.ssoFederation.enforceFederatedLogin }}' is defined as IdP."

# We always create the flow, even if SSO federation is not active, as we do not reference it
# anywhere else, it does not hurt.
- name: "Create 'sso-federation-flow' object"
  ansible.builtin.uri:
    url: "{{ global_keycloak_url }}/admin/realms/{{ global_opendesk_realm }}/authentication/flows"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ global_accesstoken }}"
    method: "POST"
    body_format: "json"
    body:
      alias: "sso-federation-flow"
      description: "openDesk authentication flow for SSO federation"
      providerId: "basic-flow"
      topLevel: true
      builtIn: false
    status_code: [201, 409]
  register: "create_flow_response"

- name: "Configuring 'sso-federation-flow': Setting exeuction steps to 'REQUIRED'"
  when: "create_flow_response.status == 201"
  ansible.builtin.include_tasks: "configure_sso_federation_authexecution.yml"

- name: "Creating upstream IdP object and handle upstream sso enforcement option"
  when: "global_cfgobj.config.ssoFederation.idps is defined"
  ansible.builtin.include_tasks: "configure_sso_federation_upstreamidp_handleenforcement.yml"
  loop: "{{ global_cfgobj.config.ssoFederation.idps | dict2items }}"
  loop_control:
    loop_var: "ssoFederationItem"

- name: "Generate list of available IdPs"
  ansible.builtin.uri:
    url: "{{ global_keycloak_url }}/admin/realms/{{ global_opendesk_realm }}/identity-provider/instances"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ global_accesstoken }}"
    method: "GET"
    body_format: "json"
    body:
      search: "sso-federation-idp"
    status_code: [200]
  register: "availableSsoFederationIdpsObject"

- name: "Get a list of aliases of available IdPs"
  when: "availableSsoFederationIdpsObject is defined"
  ansible.builtin.set_fact:
    availableSsoFederationIdps: >-
      {{ availableSsoFederationIdpsObject.json
         | selectattr('alias', 'defined')
         | map(attribute='alias')
         | list
         | select('match', 'sso-federation-idp')
      }}

- name: "Cleanup unconfigured IdPs"
  when: >-
    availableSsoFederationIdps is defined
    and not (ssoFederationIdp in configuredSsoFederationIdps | default([]))
  ansible.builtin.include_tasks: "configure_sso_federation_upstreamidp_cleanup.yml"
  loop: "{{ availableSsoFederationIdps }}"
  loop_control:
    loop_var: "ssoFederationIdp"

- name: "Cleanup enforced SSO federated login"
  ansible.builtin.include_tasks: "configure_sso_federation_handleenforcement_cleanup.yml"

...