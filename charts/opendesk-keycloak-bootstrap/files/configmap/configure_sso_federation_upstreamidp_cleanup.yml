---
- name: "Delete IdP"
  ansible.builtin.uri:
    url: "{{ global_keycloak_url }}/admin/realms/{{ global_opendesk_realm }}/identity-provider/instances/{{ ssoFederationIdp }}"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ global_accesstoken }}"
    method: "DELETE"
    status_code: [204]

...
