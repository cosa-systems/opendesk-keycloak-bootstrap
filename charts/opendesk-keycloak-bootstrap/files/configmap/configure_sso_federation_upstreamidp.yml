---
- name: "Merge explicit values into IdP config"
  when: "global_cfgobj.config.ssoFederation.enabled"
  set_fact:
    upstream_idp_config: >-
      {{
        ssoFederationItem.value.idpDetails
        | combine({ 'displayName': ssoFederationItem.value.name }, recursive=True)
        | combine({ 'alias': 'sso-federation-idp-' + ssoFederationItem.key }, recursive=True)
        | combine({ 'firstBrokerLoginFlowAlias': 'sso-federation-flow' }, recursive=True)
      }}

- name: "Create 'sso-federation-idp' object"
  when: "ssoFederationItem.value.idpDetails.enabled"
  ansible.builtin.uri:
    url: "{{ global_keycloak_url }}/admin/realms/{{ global_opendesk_realm }}/identity-provider/instances"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ global_accesstoken }}"
    method: "POST"
    body_format: "json"
    body: "{{ upstream_idp_config }}"
    status_code: [201, 409]
  register: "create_idp_response"

- name: "Update IdP in case it already exists"
  when: "ssoFederationItem.value.idpDetails.enabled and create_idp_response.status == 409"
  ansible.builtin.uri:
    url: "{{ global_keycloak_url }}/admin/realms/{{ global_opendesk_realm }}/identity-provider/instances/sso-federation-idp-{{ ssoFederationItem.key }}"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ global_accesstoken }}"
    method: "PUT"
    body_format: "json"
    body: "{{ upstream_idp_config }}"
    status_code: [204]

...
