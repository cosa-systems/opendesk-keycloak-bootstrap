---
- name: "Configure rememberMe options"
  ansible.builtin.uri:
    url: "{{ global_keycloak_url }}/admin/realms/{{ global_ums_realm }}"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ global_accesstoken }}"
    method: "PUT"
    body_format: "json"
    body: |
      {
        "rememberMe": true,
        "ssoSessionIdleTimeoutRememberMe": 0,
        "ssoSessionMaxLifespanRememberMe": 2400
      }
    status_code: [204]

- name: "Enable login with email"
  ansible.builtin.uri:
    url: "{{ global_keycloak_url }}/admin/realms/{{ global_ums_realm }}"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ global_accesstoken }}"
    method: "PUT"
    body_format: "json"
    body: |
      {
        "loginWithEmailAllowed": true,
        "duplicateEmailsAllowed": false
      }
    status_code: [204]

- name: "Enable 'save events' required for Keycloak Extensions Brute Force Protection"
  ansible.builtin.uri:
    url: "{{ global_keycloak_url }}/admin/realms/{{ global_ums_realm }}"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{ global_accesstoken }}"
    method: "PUT"
    body_format: "json"
    body: |
      {
        "eventsEnabled": true
      }
    status_code: [204]

...
