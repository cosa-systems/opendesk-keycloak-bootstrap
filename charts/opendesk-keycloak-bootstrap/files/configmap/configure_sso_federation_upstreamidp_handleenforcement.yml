---
- name: "Compute alias for this IdP"
  ansible.builtin.set_fact:
    sso_federation_current_idp_alias: >-
      {{ sso_federation_idp_prefix if ssoFederationItem.key == sso_federation_legacy_key
         else sso_federation_idp_prefix + '-' + ssoFederationItem.key }}

- name: "Creating upstream IdP object"
  ansible.builtin.include_tasks: "configure_sso_federation_upstreamidp.yml"

- name: "Handle upstream SSO enforcement option"
  ansible.builtin.include_tasks: "configure_sso_federation_handleenforcement.yml"

- name: "Create list of configured IdPs"
  ansible.builtin.set_fact:
    configuredSsoFederationIdps: "{{ configuredSsoFederationIdps | default([]) + [sso_federation_current_idp_alias] }}"

...
