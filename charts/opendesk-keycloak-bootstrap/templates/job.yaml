---
apiVersion: "batch/v1"
kind: "Job"
metadata:
  name: "{{ include "common.names.fullname" . }}-bootstrap-{{ .Release.Revision }}"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.additionalLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.additionalLabels "context" . ) | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.additionalAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.cleanup.deletePodsOnSuccess }}
  ttlSecondsAfterFinished: {{ .Values.cleanup.deletePodsOnSuccessTimeout }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" .) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
    spec:
      restartPolicy: "Never"
      {{- if or .Values.imagePullSecrets .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: "{{ . }}"
        {{- end }}
        {{- range .Values.imagePullSecrets }}
        - name: "{{ . }}"
        {{- end }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.nodeSelector "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "common.names.fullname" . }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.config.keycloak.admin.existingSecret.name }}
      {{- $adminKey := required "config.keycloak.admin.existingSecret.key is required when .name is set" .Values.config.keycloak.admin.existingSecret.key }}
      {{- /*
      The bootstrap reads its credentials from /app/admin.yaml. When the admin
      password comes from a Secret of its own, that file is assembled here
      instead of being rendered into a Secret, so the password stays out of the
      manifests. The password is escaped for the double-quoted YAML scalar it
      is written into.
      */}}
      initContainers:
        - name: "prepare-admin-credentials"
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          image: "{{ coalesce .Values.image.registry .Values.global.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          command:
            - "sh"
            - "-c"
            - |
              set -eu
              printf 'username: "%s"\n' '{{ .Values.config.keycloak.admin.values.username }}' > /admin/admin.yaml
              printf 'password: "%s"\n' \
                "$(sed -e 's/[\\"]/\\&/g' /admin-password/{{ $adminKey }})" \
                >> /admin/admin.yaml
          volumeMounts:
            - mountPath: "/admin-password"
              name: "admin-password"
              readOnly: true
            - mountPath: "/admin"
              name: "admin-creds"
          {{- with .Values.resources }}
          resources:
            {{ toYaml . | nindent 12 | trim }}
          {{- end }}
      {{- end }}
      containers:
        - name: "opendesk-keycloak-bootstrap"
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          image: "{{ coalesce .Values.image.registry .Values.global.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          command:
            - "/app/entrypoint.sh"
          volumeMounts:
            - mountPath: "/app/values.yaml"
              name: "secrets-volume"
              subPath: "values.yaml"
            - mountPath: "/app/admin.yaml"
              name: "admin-creds"
              subPath: "admin.yaml"
            - mountPath: "/app/ansible"
              name: "ansible-directory-volume"
            - mountPath: "/tmp"
              name: "temp-dir"
            {{- include "preparePossibleExistingSecret" (dict "where" .Values.config.custom.clients "what" "mount") | indent 12 }}
            {{- include "preparePossibleExistingSecret" (dict "where" .Values.config.opendesk.clients "what" "mount") | indent 12 }}
            {{- range $key, $value := .Values.config.ssoFederation.idps }}
            {{- include "preparePossibleExistingSecret" (dict "where" .idpDetails.config "what" "mount") | indent 12 }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" .) | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{ toYaml . | nindent 12 | trim }}
          {{- end }}
          env:
            - name: "OPENDESK_KEYCLOAK_BOOTSTRAP_TEMP_DIR"
              value: "/tmp"
            - name: "OPENDESK_KEYCLOAK_BOOTSTRAP_DEBUG_PAUSE_BEFORE_SCRIPT_START"
              value: "{{ .Values.config.debug.pauseBeforeScriptStart }}"
          {{- with .Values.extraEnvVars }}
            {{- . | toYaml | nindent 12 }}
          {{- end }}
      volumes:
        - name: "secrets-volume"
          secret:
            secretName: "{{ include "common.names.fullname" . }}"
        {{- if .Values.config.keycloak.admin.existingSecret.name }}
        - name: "admin-creds"
          emptyDir:
            sizeLimit: "1Mi"
        - name: "admin-password"
          secret:
            secretName: {{ .Values.config.keycloak.admin.existingSecret.name | quote }}
            items:
              - key: {{ .Values.config.keycloak.admin.existingSecret.key | quote }}
                path: {{ .Values.config.keycloak.admin.existingSecret.key | quote }}
        {{- else }}
        - name: "admin-creds"
          secret:
            secretName: {{ .Values.config.keycloak.admin.secret.name | default (printf "%s-%s" (include "common.names.fullname" .) "admin-creds") | quote }}
        {{- end }}
        - name: "temp-dir"
          emptyDir:
            sizeLimit: "20Mi"
        - name: "ansible-directory-volume"
          configMap:
            name: "{{ include "common.names.fullname" . }}-ansible"
        {{- include "preparePossibleExistingSecret" (dict "where" .Values.config.custom.clients "what" "volume") | indent 8 }}
        {{- include "preparePossibleExistingSecret" (dict "where" .Values.config.opendesk.clients "what" "volume") | indent 8 }}
        {{- range $key, $value := .Values.config.ssoFederation.idps }}
        {{- include "preparePossibleExistingSecret" (dict "where" .idpDetails.config "what" "volume") | indent 8 }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes  "context" .) | nindent 8 }}
        {{- end }}
...
