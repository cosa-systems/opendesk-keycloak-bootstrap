---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: "{{ include "common.names.fullname" . }}"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}

{{- /* The image walks this document for every `existingSecret` reference and reads each one from
       /app/secrets/<name>-<key>. The admin credentials reach it through /app/admin.yaml instead (see
       the prepare-admin-credentials init container), so that reference stays out of the dump. */}}
{{- $values := deepCopy .Values }}
{{- $_ := unset $values.config.keycloak.admin "existingSecret" }}
stringData:
  values.yaml: |
    {{ $values | toYaml | nindent 4 }}
...
{{- if not (or .Values.config.keycloak.admin.secret.name .Values.config.keycloak.admin.existingSecret.name) }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: "{{ include "common.names.fullname" . }}-admin-creds"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}

stringData:
  admin.yaml: |
    username: {{ .Values.config.keycloak.admin.values.username }}
    password: {{ .Values.config.keycloak.admin.values.password }}
...
{{- end }}

